<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="dot" id="dot"></span>
      <strong>NoAI Music</strong>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggle" checked>
      <span class="slider"></span>
    </label>
  </header>

  <section class="stats">
    <div class="stat"><b id="stat-page">0</b><span data-i18n="statPage"></span></div>
    <div class="stat"><b id="stat-today">0</b><span data-i18n="statToday"></span></div>
    <div class="stat"><b id="stat-total">0</b><span data-i18n="statTotal"></span></div>
  </section>

  <!-- 공시도 정황 신호도 없는 AI 채널은 결국 사람이 잡는다 — 그 한 번을 원클릭으로 -->
  <section class="list" id="now" style="display:none">
    <ul><li>
      <div class="meta"><span class="t" id="now-name"></span><span class="c" data-i18n="nowSub"></span></div>
      <button id="now-block" data-i18n="nowBlock"></button>
    </li></ul>
  </section>

  <section class="list">
    <h2><span data-i18n="recentTitle"></span> <span class="hint" id="recent-hint"></span></h2>
    <ul id="recent"></ul>
    <p class="empty" id="empty" data-i18n="recentEmpty"></p>
  </section>

  <section class="lists">
    <h2 data-i18n="listsTitle"></h2>
    <div class="tabs">
      <button class="tab active" data-tab="learned"><span data-i18n="tabLearned"></span> <span id="n-learned">0</span></button>
      <button class="tab" data-tab="blocked"><span data-i18n="tabBlocked"></span> <span id="n-blocked">0</span></button>
      <button class="tab" data-tab="allowed"><span data-i18n="tabAllowed"></span> <span id="n-allowed">0</span></button>
    </div>
    <p class="tabnote" id="tabnote"></p>
    <ul id="channels"></ul>
  </section>

  <footer>
    <label class="seed"><input type="checkbox" id="autoSkip" checked> <span data-i18n="optAutoSkip"></span></label>
    <label class="seed"><input type="checkbox" id="useSeed" checked> <span data-i18n="optUseSeed"></span> <span id="seed-count"></span></label>
    <label class="seed"><input type="checkbox" id="useGuess" checked> <span data-i18n="optUseGuess"></span> <span class="hint" data-i18n="optUseGuessHint"></span></label>
    <span class="credit"><span data-i18n="creditData"></span> <a href="https://souloverai.com" target="_blank" rel="noreferrer">Soul Over AI</a> (CC BY 4.0)</span>
    <span class="credit" id="donate" style="display:none"><span data-i18n="donateLine"></span>
      <a id="donate-global" target="_blank" rel="noreferrer">GitHub Sponsors</a>
      <span id="donate-sep"> · </span>
      <a id="donate-kr" target="_blank" rel="noreferrer" data-i18n="donateKr"></a>
    </span>
  </footer>

  <script src="../src/lists.js"></script>
  <script src="popup.js"></script>
</body>
</html>
